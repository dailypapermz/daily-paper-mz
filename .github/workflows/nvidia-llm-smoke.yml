name: NVIDIA NIM LLM smoke test

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: "Compare a minimal request with the structured-output request"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-paper-nvidia-llm-smoke-${{ github.repository }}-production
  cancel-in-progress: false

jobs:
  smoke:
    name: Validate isolated NVIDIA chat completions
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      NVIDIA_SMOKE_DIAGNOSTIC: ${{ inputs.diagnostic }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run bounded NVIDIA smoke or diagnostic
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node scripts/nvidia-llm-smoke.mjs
